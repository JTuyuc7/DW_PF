services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Almacenamiento compatible con S3 (equivale a S3 / R2 / Cloud Storage en la nube)
  storage:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - storagedata:/data

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Solicitudes de reunión por IP y hora (0 = sin límite, para desarrollo)
      MEETING_RATE_LIMIT: ${MEETING_RATE_LIMIT:-0}
      GPS_SERVICE_TOKEN: ${GPS_SERVICE_TOKEN:?Define GPS_SERVICE_TOKEN en .env}
      # Cliente de ejemplo de la API B2B (opcional, solo desarrollo)
      B2B_DEMO_API_KEY: ${B2B_DEMO_API_KEY:-}
      # Segundos entre barridos del motor de alertas (0 = solo bajo demanda)
      ALERT_INTERVAL_SECONDS: ${ALERT_INTERVAL_SECONDS:-60}
      SEED_PASSWORD: ${SEED_PASSWORD:?Define SEED_PASSWORD en .env}
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      # URL de la API vista desde el servidor de Next (red interna de Compose), para renderizar la landing
      API_INTERNAL_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  storagedata:
